name: trackverse
description: A thoughtful, local-first habit tracker.
publish_to: none
version: 2.0.0+6
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.39
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_sign_in_platform_interface: ^3.1.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
