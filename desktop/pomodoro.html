<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackVerse • Focus</title>
<style>
@font-face{font-family:Inter;src:url('/assets/assets/fonts/Inter.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:Lora;src:url('/assets/assets/fonts/Lora.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/assets/assets/fonts/JetBrainsMono.ttf') format('truetype');font-weight:100 900;font-display:swap}

:root{color-scheme:dark;--bg:#1b2523;--card:#22312c;--ink:#e5ede8;--muted:#a0b0a8;--accent:#7ad5b0;--line:#32423b;--on-accent:#142a20;--selected:#2b4439}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:14px var(--font,'Inter'),sans-serif;border:1px solid var(--line);border-radius:12px;overflow:hidden}body.light{color-scheme:light;--bg:#ffffff;--card:#f0f6f2;--ink:#252735;--muted:#92939f;--accent:#32816a;--line:#eeeff3;--on-accent:#ffffff;--selected:#eaf3ee}button,select,input{-webkit-app-region:no-drag;font:inherit;color:var(--ink)}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled,select:disabled,input:disabled{opacity:.4;cursor:default}.titlebar{height:40px;display:flex;justify-content:space-between;align-items:center;padding:5px 9px;-webkit-app-region:drag;user-select:none}.titlebar div{display:flex;align-items:center;gap:7px}.icon{display:grid;place-items:center;background:none;border:0;width:30px;height:30px;border-radius:7px;color:var(--muted)}.icon:hover{background:var(--card);color:var(--ink)}.close:hover{background:#bd4141;color:white}.icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}.brand{font-size:11px;color:var(--muted)}main{height:calc(100% - 40px);overflow:hidden;padding:0 22px 18px}.setup h1{font-size:21px;font-weight:600;margin:8px 0}.subtle{color:var(--muted);font-size:11px;margin:6px 0 15px}.readout{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:156px;isolation:isolate}.orb{position:absolute;width:148px;height:148px;border-radius:50%;background:radial-gradient(circle,#7ad5b018,transparent 70%);z-index:-1;opacity:0}.running .orb{opacity:1;animation:breathe 4s ease-in-out infinite}.digits{display:flex;align-items:baseline;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-1.8px;font-size:45px;line-height:1.2;white-space:nowrap}.fraction{font-size:.52em;letter-spacing:-.5px;color:var(--muted);min-width:1.5em}.units{display:flex;gap:28px;margin-top:2px;font-size:11px;color:var(--muted);padding-right:25px}.phase{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:9px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.round{border:0;border-radius:50%;width:39px;height:39px;display:grid;place-items:center;background:var(--card);color:var(--muted);transition:transform .16s}.round:hover{transform:scale(1.07)}.round:active{transform:scale(.94)}.round svg{height:17px;width:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#toggle{background:var(--accent);color:var(--on-accent)}.habitName{text-align:center;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:12px 0 0}.track{height:3px;background:var(--card);border-radius:4px;overflow:hidden;margin:16px 0 0}.fill{height:100%;width:100%;background:var(--accent);border-radius:4px;position:relative}.running .fill:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff80,transparent);animation:shimmer 2.8s linear infinite}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}label{display:block;font-size:10px;color:var(--muted);letter-spacing:.7px}input,select{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px;width:100%;margin-top:6px;font-size:12px}footer{font-size:10px;text-align:center;color:var(--muted);line-height:1.6;margin-top:13px}#error{color:#e99d85;font-size:11px;margin-top:6px;text-align:center}#error:empty{display:none}.compact .setup,.compact footer,.compact .brand{display:none}.compact main{padding:0 15px 10px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.compact .titlebar{height:35px}.compact main{height:calc(100% - 35px)}.compact .readout{min-height:68px;flex:1}.compact .digits{font-size:clamp(28px,14vw,42px)}.compact .phase{font-size:8px;letter-spacing:1.6px;margin-bottom:5px}.compact .units{font-size:10px;gap:24px}.compact .controls{margin:9px 0 0}.compact .round{width:35px;height:35px}.compact .habitName{margin-top:8px;font-size:10px}.compact .track{margin-top:10px;height:2px}.compact .orb{width:130px;height:100px}.compact #error{font-size:10px;margin-top:3px}@keyframes breathe{50%{transform:scale(1.14);opacity:.35}}@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}

.readout{min-height:126px}
body{visibility:hidden;--font:Inter;--font-step:0px;box-shadow:inset 0 1px 0 #ffffff04;transition:background .25s,color .25s,border-color .25s}
.titlebar{border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);padding:5px 10px}
.brand{font-size:calc(10px + var(--font-step));font-weight:500;letter-spacing:.2px}
.icon{transition:background .18s,color .18s}.icon:hover{background:var(--selected);color:var(--accent)}
.setup h1{font-size:calc(20px + var(--font-step));letter-spacing:-.65px;line-height:1.3;margin-top:18px}
.subtle{font-size:calc(11px + var(--font-step));line-height:1.5}
.phase{font-size:calc(9px + var(--font-step));font-weight:600;letter-spacing:1.6px}
.digits{color:var(--ink);font-size:calc(43px + var(--font-step));text-shadow:none}
.fraction{opacity:.65;font-weight:400;font-size:.38em;padding-left:2px;letter-spacing:-.5px}
.units{font-size:calc(10px + var(--font-step));opacity:.75}
.round{border:1px solid var(--line);background:var(--card);box-shadow:0 2px 5px #00000008}
#toggle{border-color:transparent;box-shadow:0 3px 10px #00000012}#toggle:hover{filter:brightness(1.06)}
.habitName{font-size:calc(11px + var(--font-step));font-weight:500;color:var(--muted)}
.track{background:var(--selected);border-radius:8px}.fill{box-shadow:0 0 8px color-mix(in srgb,var(--accent) 16%,transparent)}
input,select{background:var(--card);font-size:calc(12px + var(--font-step));border-radius:9px}
label{font-size:calc(10px + var(--font-step));font-weight:500;letter-spacing:.5px}
input:focus,select:focus{border-color:var(--accent)}footer{font-size:calc(10px + var(--font-step))}
.compact .titlebar{border-bottom:0}.compact .digits{font-size:clamp(25px,calc(13vw + var(--font-step)),42px)}
.compact .phase{font-size:calc(8px + var(--font-step));letter-spacing:1.3px}.compact .habitName{font-size:calc(10px + var(--font-step))}
.compact .units{font-size:calc(9px + var(--font-step))}.compact .round{width:36px;height:36px}
.compact .track{margin-top:13px;height:3px}.compact main{padding:0 17px 15px}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}

body.ready{visibility:visible}
/* Setup uses a fixed native content size; the readout absorbs free space. */
main{display:flex;flex-direction:column;overflow:hidden;gap:0}
.readout{flex:1;min-height:110px;max-height:190px}
.setup{flex-shrink:0}.controls,.habitName,.track,#error{flex-shrink:0}
.setup h1{margin-top:14px}.settings{margin-bottom:0}
#workspace{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#error{line-height:1.35;overflow-wrap:anywhere}
.compact .readout{max-height:none;min-height:68px}

.readout{min-height:200px;max-height:230px}.digits{font-size:calc(34px + var(--font-step));letter-spacing:-1.2px}
.zigzag{position:absolute;width:210px;height:210px;pointer-events:none;z-index:-1;overflow:visible}
.zigzag path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.7;transform-origin:100px 100px}
.ring-track{fill:none;stroke:var(--selected);stroke-width:1}.ring-progress{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:515.22;transform:rotate(-90deg);transform-origin:100px 100px;opacity:.4}
.zigzag path{animation:orbit 48s linear infinite,breathe-ring 4s ease-in-out infinite;animation-play-state:paused}.running .zigzag path{animation-play-state:running}
.compact .readout{min-height:175px;max-height:none}.compact .zigzag{width:176px;height:176px}.compact .digits{font-size:calc(24px + var(--font-step));letter-spacing:-.8px}
.compact .units{gap:17px;padding-right:18px}.compact .phase{letter-spacing:1px}.orb{display:none}
.fraction,.units{opacity:1}.digits{text-shadow:none;filter:none}.habitName{color:var(--ink)}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breathe-ring{50%{opacity:1;stroke-width:2.1}}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
</style><body><header class="titlebar"><div><button class="icon" id="view" title="Switch compact / setup view" aria-label="Switch compact or setup view"><svg viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4M7 13l6-6m-6 0h6v6"/></svg></button><span class="brand">TrackVerse · Always on top</span></div><button class="icon close" id="close" aria-label="Close timer window" title="Close window — timer keeps running"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header>
<main><section class="setup"><h1>A little time. A real difference.</h1><p class="subtle" id="workspace">Choose a habit and make room for focus.</p></section><div class="readout"><div class="orb"></div><svg class="zigzag" viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-track" cx="100" cy="100" r="89"/><path id="zigzagPath"/><circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="82"/></svg><span class="phase" id="phase">Focus</span><div class="digits" role="timer" aria-label="Time remaining"><span id="time">00:25:00</span><span class="fraction" id="fraction">.00</span></div><div class="units" aria-hidden="true"><span>hr</span><span>min</span><span>sec</span></div></div>
<div class="controls"><button class="round" id="toggle" aria-label="Start focus" title="Start focus"><svg id="toggleIcon" viewBox="0 0 20 20"><path d="m7 4 9 6-9 6Z" fill="currentColor" stroke="none"/></svg></button><button class="round" id="reset" aria-label="Finish and reset" title="Save elapsed work and reset"><svg viewBox="0 0 20 20"><path d="M5 5a7 7 0 1 1-2 5M5 1v5H1"/></svg></button></div><p class="habitName" id="session">One habit. Full attention.</p><div class="track"><div class="fill" id="fill"></div></div><section class="setup"><div style="margin-top:20px"><label for="habit">FOCUS ON A HABIT</label><select id="habit"></select></div><div class="settings"><label>WORK · MINUTES<input id="work" type="number" min="1" max="180" value="25"></label><label>BREAK · MINUTES<input id="break" type="number" min="1" max="60" value="5"></label></div></section><div id="error" role="alert"></div></main>
<script>
const $=id=>document.getElementById(id),api=(op,p)=>window.trackverseDesktop.request(op,p?JSON.stringify(p):'');let state,locked=false,dirty=false,previous,initial=true,compact=false,working=false,refreshing=false,observedAt=performance.now();
async function layout(value){if(compact===value)return;await api('timerLayout',{compact:value});compact=value;document.body.classList.toggle('compact',value);$('view').title=value?'Expand setup':'Mini view';}
async function refresh(){if(refreshing)return;refreshing=true;try{const data=JSON.parse(await api('timerState'));state=data.timer;observedAt=performance.now();document.body.classList.toggle('light',data.theme==='light');if(data.palette){for(const [key,css] of Object.entries({surface:'bg',raised:'card',text:'ink',muted:'muted',accent:'accent',border:'line',selected:'selected',onAccent:'on-accent'})){document.body.style.setProperty('--'+css,data.palette[key]);}}const type=data.typography||{};document.body.style.setProperty('--font',['Inter','Lora','JetBrains Mono'].includes(type.family)?'\"'+type.family+'\"':'Inter');document.body.style.setProperty('--font-step',Math.max(-2,Math.min(4,Number(type.step)||0))+'px');document.body.classList.add('ready');$('workspace').textContent=data.workspace;const value=$('habit').value||state.habitId;const options=data.habits.map(h=>[h.id,h.name]);if(JSON.stringify(options)!==previous){$('habit').replaceChildren(...options.map(([id,name])=>new Option(name,id)));previous=JSON.stringify(options);$('habit').value=options.some(([id])=>id===value)?value:options[0]?.[0]||'';}if(initial){$('work').value=state.work;$('break').value=state.break;initial=false;if(state.running||state.session)await layout(true);}locked=state.running||!!state.session;for(const id of ['habit','work','break'])$(id).disabled=locked;document.body.classList.toggle('running',state.running);$('phase').textContent=state.phase==='break'?(state.running?'Recharge':'Break ready'):(state.running?'Focus':state.session?'Paused':'Ready to focus');$('session').textContent=state.session?.name||$('habit').selectedOptions[0]?.textContent||'Add a habit to begin';const label=state.running?'Pause':state.session?'Resume':state.phase==='break'?'Start break':'Start focus';$('toggle').title=label;$('toggle').setAttribute('aria-label',label);$('toggleIcon').innerHTML=state.running?'<path d="M6 4v12M14 4v12" stroke-width="3"/>':'<path d="m7 4 9 6-9 6Z" fill="currentColor" stroke="none"/>';$('toggle').disabled=!state.running&&state.phase==='work'&&!state.session&&!$('habit').value;$('reset').disabled=!state.session&&!state.running&&state.phase==='work';}catch(e){document.body.classList.add('ready');$('error').textContent=e.message;}finally{refreshing=false;}}
function animate(){if(state){const seconds=Math.max(0,state.remaining-(state.running?(performance.now()-observedAt)/1000:0)),whole=Math.floor(seconds);$('time').textContent=String(Math.floor(whole/3600)).padStart(2,'0')+':'+String(Math.floor(whole/60)%60).padStart(2,'0')+':'+String(whole%60).padStart(2,'0');$('fraction').textContent='.'+String(Math.floor((seconds-whole)*100)).padStart(2,'0');$('ringProgress').style.strokeDashoffset=515.22*(1-Math.max(0,Math.min(1,seconds/(state[state.phase]*60))));$('fill').style.width=(Math.max(0,Math.min(1,seconds/(state[state.phase]*60)))*100)+'%';}requestAnimationFrame(animate);}
for(const id of ['work','break','habit'])$(id).addEventListener('change',()=>dirty=true);
async function act(action){if(working)return;working=true;try{$('error').textContent='';if(action==='start'&&dirty&&!locked){await api('timerAction',{action:'configure',work:Number($('work').value),break:Number($('break').value),habitId:$('habit').value});dirty=false;}await api('timerAction',{action,habitId:$('habit').value});await refresh();if(action==='start')await layout(true);}catch(e){$('error').textContent=e.message;}finally{working=false;}}
$('toggle').onclick=()=>act(state?.running?'pause':'start');$('reset').onclick=()=>act('reset');$('view').onclick=()=>layout(!compact).catch(e=>$('error').textContent=e.message);$('close').onclick=()=>api('timerClose').catch(e=>$('error').textContent=e.message);function smoothWavePath(){const count=80,points=Array.from({length:count},(_,i)=>{const a=i*Math.PI*2/count,r=90+2.8*Math.sin(a*10);return [100+Math.cos(a)*r,100+Math.sin(a)*r];});const point=i=>points[(i+count)%count],fmt=p=>p.map(v=>v.toFixed(3)).join(',');let d='M'+fmt(points[0]);for(let i=0;i<count;i++){const a=point(i-1),b=point(i),c=point(i+1),e=point(i+2);d+='C'+fmt([b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6])+' '+fmt([c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6])+' '+fmt(c);}return d+'Z';}$('zigzagPath').setAttribute('d',smoothWavePath());refresh();setInterval(refresh,500);requestAnimationFrame(animate);
</script></body></html>
